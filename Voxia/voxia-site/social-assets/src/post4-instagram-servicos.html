<!doctype html>
<html><head><meta charset="utf-8"><style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:1080px;height:1350px;overflow:hidden;}
  body{font-family:"Segoe UI","Helvetica Neue",Arial,sans-serif;}
  .canvas{
    width:1080px;height:1350px;position:relative;
    background:#F4F5F1; color:#1C2321;
    padding:110px 96px;
    display:flex; flex-direction:column;
  }
  .eyebrow{font-size:15px; text-transform:uppercase; letter-spacing:.16em; font-weight:700; color:#A9764F; margin-bottom:22px;}
  h1{font-family:Georgia,"Iowan Old Style","Times New Roman",serif; font-size:52px; line-height:1.2; color:#1C2921; max-width:13ch; margin:0 0 70px;}
  .item{border-top:2px solid #A9764F; padding-top:20px; margin-bottom:44px;}
  .item h3{font-family:Georgia,serif; font-size:30px; color:#1C2921; margin:0 0 8px;}
  .item p{font-size:19px; line-height:1.5; color:#4B5551; margin:0; max-width:34ch;}
  .mark{position:absolute; right:96px; bottom:70px; width:56px; height:56px;}
</style></head>
<body>
  <div class="canvas">
    <p class="eyebrow">O que fazemos</p>
    <h1>Quatro formas de organizar sua voz</h1>
    <div class="item"><h3>Diagnóstico</h3><p>Um raio-x de como sua marca é percebida hoje.</p></div>
    <div class="item"><h3>Narrativa contínua</h3><p>Voz consistente, mês a mês.</p></div>
    <div class="item"><h3>Manual de marca</h3><p>Pra qualquer pessoa do time escrever igual.</p></div>
    <div class="item"><h3>Prontidão para crise</h3><p>Um plano pronto antes do susto.</p></div>
    <svg class="mark" viewBox="0 0 100 100" fill="none">
      <path d="M50 80C28 80 19 59 19 45C19 27 33 16 50 16" stroke="#3C6E52" stroke-width="7" stroke-linecap="round"/>
      <path d="M50 69C34 69 27 55 27 45C27 32 37 24 50 24" stroke="#A9764F" stroke-width="7" stroke-linecap="round"/>
      <path d="M50 58C41 58 36 49 36 45C36 38 43 32 50 32" stroke="#1C2321" stroke-width="7" stroke-linecap="round"/>
    </svg>
  </div>
</body></html>
