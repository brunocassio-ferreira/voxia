<!doctype html>
<html><head><meta charset="utf-8"><style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:1200px;height:627px;overflow:hidden;}
  body{font-family:"Segoe UI","Helvetica Neue",Arial,sans-serif;}
  .canvas{
    width:1200px;height:627px;position:relative;
    background:#1C2921;
    background-image:radial-gradient(circle at 88% 8%, rgba(201,154,114,.18), transparent 45%),
                      radial-gradient(circle at 4% 96%, rgba(60,110,82,.32), transparent 50%);
    color:#F4F5F1;
    padding:72px 80px;
    display:flex; flex-direction:column; justify-content:center;
  }
  .eyebrow{font-size:15px; text-transform:uppercase; letter-spacing:.18em; font-weight:700; color:#C79A72; margin-bottom:26px;}
  h1{font-family:Georgia,"Iowan Old Style","Times New Roman",serif; font-size:64px; line-height:1.14; max-width:11ch; margin:0;}
  .mark{position:absolute; right:80px; bottom:64px; width:64px; height:64px;}
</style></head>
<body>
  <div class="canvas">
    <p class="eyebrow">Consultoria de Reputação e Narrativa</p>
    <h1>A Voxia está no ar.</h1>
    <svg class="mark" viewBox="0 0 100 100" fill="none">
      <path d="M50 80C28 80 19 59 19 45C19 27 33 16 50 16" stroke="#3C6E52" stroke-width="7" stroke-linecap="round"/>
      <path d="M50 69C34 69 27 55 27 45C27 32 37 24 50 24" stroke="#A9764F" stroke-width="7" stroke-linecap="round"/>
      <path d="M50 58C41 58 36 49 36 45C36 38 43 32 50 32" stroke="#F4F5F1" stroke-width="7" stroke-linecap="round"/>
    </svg>
  </div>
</body></html>
