<!doctype html>
<html><head><meta charset="utf-8"><style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:1080px;height:1350px;overflow:hidden;}
  body{font-family:"Segoe UI","Helvetica Neue",Arial,sans-serif;}
  .canvas{
    width:1080px;height:1350px;position:relative;
    background:#1C2921;
    background-image:radial-gradient(circle at 85% 12%, rgba(201,154,114,.18), transparent 45%),
                      radial-gradient(circle at 10% 90%, rgba(60,110,82,.32), transparent 50%);
    color:#F4F5F1;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:0 100px;
  }
  .mark{width:150px; height:150px; margin-bottom:44px;}
  .word{font-family:Georgia,"Iowan Old Style","Times New Roman",serif; font-size:76px; margin:0 0 28px; letter-spacing:.01em;}
  .tag{font-family:Georgia,serif; font-style:italic; font-size:30px; color:#C79A72; max-width:16ch; line-height:1.4; margin:0;}
</style></head>
<body>
  <div class="canvas">
    <svg class="mark" viewBox="0 0 100 100" fill="none">
      <path d="M50 80C28 80 19 59 19 45C19 27 33 16 50 16" stroke="#3C6E52" stroke-width="6" stroke-linecap="round"/>
      <path d="M50 69C34 69 27 55 27 45C27 32 37 24 50 24" stroke="#A9764F" stroke-width="6" stroke-linecap="round"/>
      <path d="M50 58C41 58 36 49 36 45C36 38 43 32 50 32" stroke="#F4F5F1" stroke-width="6" stroke-linecap="round"/>
    </svg>
    <p class="word">voxia</p>
    <p class="tag">Cada marca tem uma voz. A Voxia encontra a certa.</p>
  </div>
</body></html>
