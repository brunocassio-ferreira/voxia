<!doctype html>
<html><head><meta charset="utf-8"><style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:1200px;height:627px;overflow:hidden;}
  body{font-family:"Segoe UI","Helvetica Neue",Arial,sans-serif;}
  .canvas{
    width:1200px;height:627px;position:relative;
    background:#1C2921;
    background-image:radial-gradient(circle at 88% 10%, rgba(201,154,114,.18), transparent 45%);
    color:#F4F5F1;
    padding:72px 80px;
    display:flex; flex-direction:column; justify-content:center;
  }
  .eyebrow{font-size:15px; text-transform:uppercase; letter-spacing:.18em; font-weight:700; color:#C79A72; margin-bottom:26px;}
  h1{font-family:Georgia,"Iowan Old Style","Times New Roman",serif; font-size:54px; line-height:1.18; max-width:12ch; margin:0 0 34px;}
  .badge{
    display:inline-flex; align-items:center; gap:10px; background:#A9764F; color:#1C1410;
    font-size:16px; font-weight:700; padding:14px 26px; border-radius:6px; width:fit-content;
  }
</style></head>
<body>
  <div class="canvas">
    <p class="eyebrow">Diagnóstico de Reputação e Narrativa</p>
    <h1>Vamos conversar?</h1>
    <div class="badge">WhatsApp no perfil →</div>
  </div>
</body></html>
