<!doctype html>
<html><head><meta charset="utf-8"><style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:1200px;height:627px;overflow:hidden;}
  body{font-family:"Segoe UI","Helvetica Neue",Arial,sans-serif;}
  .canvas{
    width:1200px;height:627px;position:relative;
    background:#2B3F35; color:#F4F5F1;
    padding:64px 84px;
    display:flex; flex-direction:column; justify-content:center;
  }
  .quote-mark{font-family:Georgia,serif; font-size:110px; color:#A9764F; line-height:1; margin-bottom:-10px;}
  blockquote{font-family:Georgia,"Iowan Old Style","Times New Roman",serif; font-size:42px; line-height:1.32; max-width:20ch; margin:0 0 30px; text-wrap:balance;}
  blockquote b{color:#C79A72; font-weight:400;}
  .cite{font-size:14px; text-transform:uppercase; letter-spacing:.1em; font-weight:700; color:#C79A72;}
</style></head>
<body>
  <div class="canvas">
    <p class="quote-mark">&ldquo;</p>
    <blockquote>Reputação não é o que você posta na terça. É o que sua marca consegue dizer <b>no pior dia do ano.</b></blockquote>
    <p class="cite">Voxia — Consultoria de Reputação e Narrativa</p>
  </div>
</body></html>
