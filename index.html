<style>
  :root{
    --paper:#F4F5F1;
    --paper-2:#ECEEE6;
    --ink:#1C2321;
    --ink-soft:#4B5551;
    --pine:#2B3F35;
    --pine-deep:#1C2921;
    --clay:#A9764F;
    --clay-soft:#C79A72;
    --hairline:#D7D6C7;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:"IBM Plex Sans","Segoe UI","Helvetica Neue",Arial,sans-serif;
    font-size:16px; line-height:1.65; -webkit-font-smoothing:antialiased;

  img{max-width:100%; display:block;}
  a{color:inherit;}
  .wrap{max-width:1080px; margin:0 auto; padding:0 24px;}
  .serif{font-family:"Lora",Georgia,"Iowan Old Style","Times New Roman",serif;}

  /* header */
  header{
    position:sticky; top:0; z-index:50; background:rgba(244,245,241,.92);
    backdrop-filter:blur(6px); border-bottom:1px solid var(--hairline);
  }
  .nav{display:flex; align-items:center; justify-content:space-between; padding:16px 24px; gap:20px;}
  .brand{display:flex; align-items:center; gap:10px; text-decoration:none;}
  .brand svg{width:30px; height:30px;}
  .brand span{font-family:"Lora",Georgia,serif; font-size:20px; color:var(--pine-deep); letter-spacing:.01em;}
  .navlinks{display:flex; gap:26px; font-size:14px; font-weight:600;}
  .navlinks a{text-decoration:none; color:var(--ink-soft);}
  .navlinks a:hover{color:var(--clay);}
  .nav-toggle{
    display:none; align-items:center; justify-content:center; width:38px; height:38px;
    padding:0; border:1px solid var(--hairline); border-radius:5px; background:transparent; cursor:pointer;
  }
  .nav-toggle svg{width:20px; height:20px; color:var(--pine-deep);}
  @media (max-width:720px){
    .navlinks{
      display:flex; flex-direction:column; gap:0; position:absolute; top:100%; left:0; right:0;
      background:var(--paper); border-bottom:1px solid var(--hairline);
      max-height:0; overflow:hidden; transition:max-height .2s ease;
    }
    .navlinks a{padding:14px 24px; border-top:1px solid var(--hairline);}
    .navlinks.open{max-height:320px;}
    .nav-toggle{display:inline-flex;}
  }
  .btn{
    display:inline-flex; align-items:center; gap:8px; font-size:13.5px; font-weight:700;
    padding:11px 20px; border-radius:5px; text-decoration:none; letter-spacing:.01em;
    border:1px solid transparent; cursor:pointer;
  }
  .btn-clay{background:var(--clay); color:#1C1410;}
  .btn-clay:hover{background:var(--clay-soft);}
  .btn-outline-dark{background:transparent; border-color:rgba(244,245,241,.35); color:var(--paper);}
  .btn-outline-dark:hover{border-color:rgba(244,245,241,.7);}

  /* hero */
  .hero{
    background:var(--pine-deep);
    background-image:radial-gradient(circle at 88% 8%, rgba(201,154,114,.16), transparent 45%),

    color:var(--paper); padding:96px 0 100px;
  }
  .eyebrow{font-size:12px; text-transform:uppercase; letter-spacing:.16em; font-weight:700; margin:0 0 20px;}
  .hero .eyebrow{color:var(--clay-soft);}
  .hero h1{font-size:clamp(32px,5.4vw,54px); line-height:1.16; margin:0 0 22px; text-wrap:balance; max-width:16ch;}
  .hero .lede{font-size:18px; line-height:1.65; color:rgba(244,245,241,.75); max-width:56ch; margin:0 0 34px;}
  .hero .ctas{display:flex; gap:12px; flex-wrap:wrap;}

  /* sections */
  section{padding:88px 0;}
  section.alt{background:var(--paper-2);}
  .sec-eyebrow{font-size:11.5px; text-transform:uppercase; letter-spacing:.14em; font-weight:700; color:var(--clay); margin:0 0 16px;}
  h2{font-size:clamp(26px,3.4vw,34px); line-height:1.25; color:var(--pine-deep); margin:0 0 26px; text-wrap:balance; max-width:22ch;}
  .lead-p{font-size:17px; line-height:1.75; color:var(--ink); max-width:64ch; margin:0 0 18px;}
  .lead-p:last-child{margin-bottom:0;}

  .grid-4{display:grid; grid-template-columns:repeat(2,1fr); gap:18px; margin-top:8px;}
  @media (max-width:680px){.grid-4{grid-template-columns:1fr;}}
  .card{background:#fff; border:1px solid var(--hairline); border-radius:8px; padding:26px 24px;}
  .card h3{font-family:"Lora",Georgia,serif; font-size:19px; color:var(--pine-deep); margin:0 0 10px;}
  .card p{font-size:15px; line-height:1.65; color:var(--ink-soft); margin:0;}

  .grid-3{display:grid; grid-template-columns:repeat(3,1fr); gap:22px; margin-top:8px;}
  @media (max-width:720px){.grid-3{grid-template-columns:1fr;}}
  .proof h4{font-family:"Lora",Georgia,serif; font-size:16.5px; color:var(--pine-deep); margin:0 0 8px; padding-top:14px; border-top:2px solid var(--clay);}
  .proof p{font-size:14.5px; line-height:1.65; color:var(--ink-soft); margin:0;}

  /* noticias */
  .news-slider-row{display:flex; align-items:center; gap:14px; margin-top:8px;}
  .news-viewport{overflow:hidden; flex:1; border-radius:8px;}
  .news-track{display:flex; transition:transform .45s ease;}
  .news-card{flex:0 0 100%; max-width:100%; background:#fff; border:1px solid var(--hairline); border-radius:8px; overflow:hidden; display:flex; flex-direction:column;}
  .news-card img{width:100%; aspect-ratio:16/10; object-fit:cover; background:var(--pine-deep);}
  .news-body{padding:24px 26px;}
  .news-date{font-size:11.5px; text-transform:uppercase; letter-spacing:.08em; color:var(--clay); font-weight:700; margin:0 0 8px;}
  .news-card h3{font-family:"Lora",Georgia,serif; font-size:18px; color:var(--pine-deep); margin:0 0 10px;}
  .news-card p{font-size:14.5px; line-height:1.65; color:var(--ink-soft); margin:0;}
  @media (min-width:721px){
    .news-card{flex-direction:row;}
    .news-card img{width:40%; aspect-ratio:auto; height:auto;}
    .news-body{flex:1; padding:30px 34px;}
  }
  .news-arrow{
    flex:none; width:40px; height:40px; border-radius:50%; border:1px solid var(--hairline);
    background:#fff; color:var(--pine-deep); font-size:19px; line-height:1; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  .news-arrow:hover{background:var(--paper-2); border-color:var(--clay);}
  .news-dots{display:flex; gap:8px; justify-content:center; margin-top:18px;}
  .news-dot{width:8px; height:8px; border-radius:50%; border:none; background:var(--hairline); cursor:pointer; padding:0;}
  .news-dot.active{background:var(--clay);}

  /* cta final */
  .cta-final{background:var(--pine-deep); color:var(--paper); text-align:left;}
  .cta-final h2{color:var(--paper); max-width:20ch;}
  .cta-final p{color:rgba(244,245,241,.75); font-size:17px; max-width:52ch; margin:0 0 30px;}
  .cta-final .ctas{display:flex; align-items:center; gap:20px; flex-wrap:wrap;}
  .cta-alt-link{font-size:14px; font-weight:600; color:rgba(244,245,241,.75); text-decoration:underline; text-underline-offset:3px;}
  .cta-alt-link:hover{color:var(--paper);}

  footer{background:var(--pine); color:rgba(244,245,241,.85); padding:52px 0 36px;}
  .foot-grid{display:flex; justify-content:space-between; gap:30px; flex-wrap:wrap; padding-bottom:28px; border-bottom:1px solid rgba(244,245,241,.15);}
  .foot-brand{display:flex; align-items:center; gap:10px;}
  .foot-brand span{font-family:"Lora",Georgia,serif; font-size:19px; color:var(--paper);}
  .foot-links{display:flex; gap:22px; flex-wrap:wrap; font-size:14px;}
  .foot-links a{text-decoration:none; display:flex; align-items:center; gap:7px;}
  .foot-links a:hover{color:var(--clay-soft);}
  .foot-links svg{width:16px; height:16px;}
  .foot-bottom{display:flex; justify-content:space-between; gap:16px; flex-wrap:wrap; padding-top:22px; font-size:12.5px; color:rgba(244,245,241,.5);}
</style>

<script>
(function(){
  var toggle = document.getElementById("nav-toggle");
  var links = document.getElementById("navlinks-mobile");
  if(!toggle || !links) return;
  toggle.addEventListener("click", function(){
    var isOpen = links.classList.toggle("open");
    toggle.setAttribute("aria-expanded", isOpen ? "true" : "false");
  });
  Array.prototype.forEach.call(links.querySelectorAll("a"), function(a){
    a.addEventListener("click", function(){
      links.classList.remove("open");
      toggle.setAttribute("aria-expanded", "false");
    });
  });
})();

function waLink(numero, textoPreenchido){
  var msg = textoPreenchido ? "?text=" + encodeURIComponent(textoPreenchido) : "";
  return "https://wa.me/" + numero + msg;
}

function render(content){
  var c = content;

  document.getElementById("hero-eyebrow").textContent = c.hero.eyebrow;
  document.getElementById("hero-headline").textContent = c.hero.headline;
  document.getElementById("hero-lede").textContent = c.hero.lede;
  document.getElementById("hero-cta").textContent = c.hero.ctaLabel;
  document.getElementById("hero-cta-secondary").textContent = c.hero.ctaSecondaryLabel;

  document.getElementById("sobre-eyebrow").textContent = c.sobre.eyebrow;
  document.getElementById("sobre-titulo").textContent = c.sobre.titulo;
  var sobreWrap = document.getElementById("sobre-paragrafos");
  sobreWrap.innerHTML = "";
  c.sobre.paragrafos.forEach(function(p){
    var el = document.createElement("p"); el.className = "lead-p"; el.textContent = p;
    sobreWrap.appendChild(el);
  });

  document.getElementById("servicos-eyebrow").textContent = c.servicos.eyebrow;
  document.getElementById("servicos-titulo").textContent = c.servicos.titulo;
  var svcGrid = document.getElementById("servicos-grid");
  svcGrid.innerHTML = "";
  c.servicos.itens.forEach(function(item){
    var card = document.createElement("div"); card.className = "card";
    var h3 = document.createElement("h3"); h3.textContent = item.titulo;
    var p = document.createElement("p"); p.textContent = item.texto;
    card.appendChild(h3); card.appendChild(p); svcGrid.appendChild(card);
  });

  document.getElementById("metodo-eyebrow").textContent = c.metodo.eyebrow;
  document.getElementById("metodo-titulo").textContent = c.metodo.titulo;
  var metWrap = document.getElementById("metodo-paragrafos");
  metWrap.innerHTML = "";
  c.metodo.paragrafos.forEach(function(p){
    var el = document.createElement("p"); el.className = "lead-p"; el.textContent = p;
    metWrap.appendChild(el);
  });

  var noticiasSection = document.getElementById("noticias");
  var noticiasNavLink = document.getElementById("nav-novidades-link");
  var destacadas = (c.noticias.itens || []).filter(function(item){ return item.destaque !== false; });

  if(destacadas.length === 0){
    noticiasSection.style.display = "none";
    if(noticiasNavLink) noticiasNavLink.style.display = "none";
  } else {
    noticiasSection.style.display = "";
    if(noticiasNavLink) noticiasNavLink.style.display = "";

    document.getElementById("noticias-eyebrow").textContent = c.noticias.eyebrow;
    document.getElementById("noticias-titulo").textContent = c.noticias.titulo;

    var newsTrack = document.getElementById("noticias-grid");
    newsTrack.innerHTML = "";
    destacadas.forEach(function(item){
      var card = document.createElement("div"); card.className = "news-card";
      var img = document.createElement("img"); img.src = item.foto; img.alt = item.titulo;
      var body = document.createElement("div"); body.className = "news-body";
      var date = document.createElement("p"); date.className = "news-date"; date.textContent = item.data;
      var h3 = document.createElement("h3"); h3.textContent = item.titulo;
      var p = document.createElement("p"); p.textContent = item.texto;
      body.appendChild(date); body.appendChild(h3); body.appendChild(p);
      card.appendChild(img); card.appendChild(body); newsTrack.appendChild(card);
    });

    var prevBtn = document.getElementById("news-prev");
    var nextBtn = document.getElementById("news-next");
    var dotsWrap = document.getElementById("noticias-dots");
    dotsWrap.innerHTML = "";
    var n = destacadas.length;
    var idx = 0;

    function updateSlider(){
      newsTrack.style.transform = "translateX(-" + (idx * 100) + "%)";
      Array.prototype.forEach.call(dotsWrap.children, function(dot, i){
        dot.classList.toggle("active", i === idx);
      });
    }

    if(n > 1){
      prevBtn.style.display = "";
      nextBtn.style.display = "";
      for(var i = 0; i < n; i++){
        (function(i){
          var dot = document.createElement("button");
          dot.className = "news-dot";
          dot.setAttribute("aria-label", "Ir para novidade " + (i + 1));
          dot.addEventListener("click", function(){ idx = i; updateSlider(); });
          dotsWrap.appendChild(dot);
        })(i);
      }
      prevBtn.onclick = function(){ idx = (idx - 1 + n) % n; updateSlider(); };
      nextBtn.onclick = function(){ idx = (idx + 1) % n; updateSlider(); };
    } else {
      prevBtn.style.display = "none";
      nextBtn.style.display = "none";
    }
    updateSlider();
  }

  document.getElementById("prova-eyebrow").textContent = c.prova.eyebrow;
  document.getElementById("prova-titulo").textContent = c.prova.titulo;
  var provaGrid = document.getElementById("prova-grid");
  provaGrid.innerHTML = "";
  c.prova.itens.forEach(function(item){
    var wrap = document.createElement("div"); wrap.className = "proof";
    var h4 = document.createElement("h4"); h4.textContent = item.titulo;
    var p = document.createElement("p"); p.textContent = item.texto;
    wrap.appendChild(h4); wrap.appendChild(p); provaGrid.appendChild(wrap);
  });

  document.getElementById("ctafinal-titulo").textContent = c.ctaFinal.titulo;
  document.getElementById("ctafinal-texto").textContent = c.ctaFinal.texto;
  var ctaBtn = document.getElementById("ctafinal-cta");
  ctaBtn.textContent = c.ctaFinal.ctaLabel;
  ctaBtn.href = waLink(c.contato.whatsapp, "Oi! Vim pelo site da Voxia e queria marcar uma conversa.");
  document.getElementById("ctafinal-email").href = "mailto:" + c.contato.email + "?subject=" + encodeURIComponent("Vim pelo site da Voxia") + "&body=" + encodeURIComponent("Oi! Vim pelo site da Voxia e queria marcar uma conversa.");

  var navWa = document.getElementById("nav-whatsapp");
  navWa.href = waLink(c.contato.whatsapp, "Oi! Vim pelo site da Voxia e queria marcar uma conversa.");

  document.getElementById("foot-whatsapp").href = waLink(c.contato.whatsapp);
  document.getElementById("foot-whatsapp-label").textContent = c.contato.whatsappDisplay;
  document.getElementById("foot-instagram").href = "https://instagram.com/" + c.contato.instagram.replace(/^@/, "");
  document.getElementById("foot-instagram-label").textContent = "@" + c.contato.instagram.replace(/^@/, "");
  document.getElementById("foot-linkedin").href = c.contato.linkedin;
  document.getElementById("foot-email").href = "mailto:" + c.contato.email;
  document.getElementById("foot-email-label").textContent = c.contato.email;
  document.getElementById("foot-cidade").textContent = c.contato.cidade;
  document.getElementById("foot-ano").textContent = new Date().getFullYear();
}

// tenta carregar content.json (o arquivo que o editor.html exporta);
// se não existir ainda ou a página estiver sendo aberta localmente sem servidor, usa o conteúdo padrão embutido.
fetch("content.json", {cache: "no-store"})
  .then(function(r){ if(!r.ok) throw new Error("sem content.json"); return r.json(); })
  .then(function(data){ render(data); })
  .catch(function(){ render(window.VOXIA_DEFAULT_CONTENT); });
</script>
